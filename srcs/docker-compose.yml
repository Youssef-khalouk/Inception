
services:
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
      - redis
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - network
    secrets:
      - db_password

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - network

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network
    restart: always
    secrets:
      - db_password
  
  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    restart: always
    networks:
      - network

  ftp:
    build: ./requirements/bonus/ftp
    volumes:
      - wordpress_data:/var/www/html
    container_name: ftp
    depends_on:
      - wordpress
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - network
  
  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    restart: always
    ports:
      - 8081:8081
    networks:
      - network
  
  cv:
    container_name: cv
    build: ./requirements/bonus/my_cv
    restart: always
    networks:
      - network
  
  portainer:
    build: requirements/bonus/portainer
    container_name: portainer
    networks:
      - network
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always


volumes:
  wordpress_data:
  mariadb_data:
  portainer_data:
    name : portainer
    driver: local
    driver_opts:
      type: none
      device: /${HOME}/data/portainer
      o: bind

networks:
    network:
        driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
