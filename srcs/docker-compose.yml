
services:
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
      - redis
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - network
    secrets:
      - db_password
      - db_root_password
      - wp_admin_password

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - network

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network
    restart: always
    secrets: # ????????????
      - db_password
      - db_root_password
  
  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    restart: always
    networks:
      - network

volumes:
  wordpress_data:
  mariadb_data:

networks:
    network:
        driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt
  
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
