server {
	listen 443 ssl;
	listen [::]:443 ssl;

	server_name ykhalouk.42.fr;
	
	ssl_certificate		/etc/nginx/ssl/ykhalouk.crt;
	ssl_certificate_key	/etc/nginx/ssl/ykhalouk.key;

	ssl_protocols		TLSv1.2;
	
	root /var/www/html;
	index index.php;

	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$; # example  /page/index.php/user/12   ->   /page/index.php (user/12)
		fastcgi_pass wordpress:9000;              # wordpress is docker network
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		fastcgi_param HTTP_HOST $http_host;
		fastcgi_param HTTPS on;
	}

	# BONUS PART # latter
}
